<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SAA Co.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <main id="snmain">
        <header id="header">
            <button id="hmbtn">
            <img src="logo.png" alt="" id="logo">
            </button>
        <button id="loginbtn">Login</button>
        </header>
        <div id="container">
        <form action="">
          <h1 id="sheader">Sign Up</h1><br><br><br><br><br>
          <label for="username" id="label1">Username:</label><br><br>
          <input type="text" name="Username" id="username" required="true"><br><br><br>
        <label for="email" id="label1">Email:</label><br><br>
          <input type="text" name="Email" id="email" required="true"><br><br><br>
          <label for="password" id="label1">Password:</label><br><br>
          <input type="password" name="Password" id="password" required="true"><br><br><br>
          <label for="confirmPassword" id="label1">Confirm Password:</label><br><br>
          <input type="password" name="ConfirmPassword" id="confirmPassword"    required="true"><br><br>
          <button id="snbtn" type="submit">Sign Up</button><br><br>
          <div id="su">Already have an account?<a href="sign-in.html">Log In</a></div>
        </form>
        </div>
        
    </main>
    <script>
        const hmbtn = document.getElementById('hmbtn');
        hmbtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        const loginBtns = document.querySelectorAll('#loginbtn');
        if (loginBtns && loginBtns.length) {
        const target = window.location.pathname.includes('/History/') ? '../sign-in.html' : 'sign-in.html';
        loginBtns.forEach(btn => btn.addEventListener('click', () => { window.location.href = target; }));
}
    </script>
  </body>
</html>
